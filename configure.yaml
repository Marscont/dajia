targettime: "2022050100"
time_index: null

assim_domain: "d02"
domain_resolution_km:
  d01: 27
  d02: 9
  d03: 3

wrfout_files:
  d01: "/path/to/wrfout_d01_YYYY-MM-DD_HH:MM:SS"
  d02: "/path/to/wrfout_d02_YYYY-MM-DD_HH:MM:SS"
  d03: "/path/to/wrfout_d03_YYYY-MM-DD_HH:MM:SS"

obs_root_dir: "/path/to/obs"
output_base_dir: "./output"

observation_sources:
  - name: "satellite_xco2"
    type: "xco2"
    csv_file: "sat_xco2.csv"
    columns:
      lat: "Latitude"
      lon: "Longitude"
      val: "xco2"
      err: "xco2_uncertainty"
    default_err: 0.5
    val_range: [390, 430]

  - name: "ground_station"
    type: "surface"
    csv_file: "ground.csv"
    columns:
      lat: "Latitude"
      lon: "Longitude"
      val: "co2_profile_apriori_0"
      err: "xco2_uncertainty"
    default_err: 0.8
    val_range: [370, 460]

num_members: 32
sigma_threshold: 3.0
co2_system_bias: 410.0

surface_interp_height_m: 50.0
xco2_levels: 20

matching_method: "nearest"   # nearest|bilinear（当前实现nearest）

inflation_mode: "adaptive"   # adaptive|fixed
inflation_factor: 1.1
adaptive_inflation_min: 1.0
adaptive_inflation_max: 1.3

localization_radius_grid_base: 8.0
initial_ensemble_std: 0.8
min_emission: 0.0001
